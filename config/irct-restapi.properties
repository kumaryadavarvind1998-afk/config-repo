# =========================================================
# Spring Application Configuration
# =========================================================

spring.application.name=irctc-restapi


# =========================================================
# Server Configuration
# =========================================================

server.port=8086


# =========================================================
# MySQL Database Configuration
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/irctc
spring.datasource.username=root
spring.datasource.password=Arvind@2314
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# Hibernate / JPA Configuration
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


# =========================================================
# Eureka Service Discovery Configuration
# =========================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true


# =========================================================
# Kafka Configuration
# =========================================================

spring.kafka.bootstrap-servers=localhost:9092

# Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


# =========================================================
# OpenFeign Micrometer Configuration
# =========================================================

spring.cloud.openfeign.micrometer.enabled=true


# =========================================================
# Resilience4j Circuit Breaker Configuration
# =========================================================

resilience4j.circuitbreaker.instances.payment-service-irctc.registerHealthIndicator=true

resilience4j.circuitbreaker.instances.payment-service-irctc.slidingWindowSize=5

resilience4j.circuitbreaker.instances.payment-service-irctc.minimumNumberOfCalls=5

resilience4j.circuitbreaker.instances.payment-service-irctc.failureRateThreshold=50

resilience4j.circuitbreaker.instances.payment-service-irctc.waitDurationInOpenState=20s

resilience4j.circuitbreaker.instances.payment-service-irctc.permittedNumberOfCallsInHalfOpenState=2

resilience4j.circuitbreaker.instances.payment-service-irctc.automaticTransitionFromOpenToHalfOpenEnabled=true


# =========================================================
# Actuator Configuration
# =========================================================

management.endpoints.web.exposure.include=*

management.endpoint.health.show-details=always

management.info.env.enabled=true


# =========================================================
# Distributed Tracing - Micrometer
# =========================================================

management.tracing.enabled=true

management.tracing.sampling.probability=1.0


# =========================================================
# Zipkin Configuration
# =========================================================

management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans


# =========================================================
# Application Information
# =========================================================

info.application.name=IRCTC Booking Service
info.application.description=IRCTC Booking REST API Microservice
info.application.version=1.0.0


# =========================================================
# Resilience4j Logging
# =========================================================

logging.level.io.github.resilience4j=DEBUG


# =========================================================
# Distributed Tracing - Trace ID & Span ID in Logs
# =========================================================

logging.pattern.level=%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]
